{# ─────────────────────── DEVICE COMPARE DRAWER ─────────────────────── #}
{% load i18n %}
<div x-data="{
        isOpen: false,
        items: [],
        addCompare(product) {
            if (this.items.some(i => i.id === product.id)) return;
            if (this.items.length >= 3) {
                alert('You can compare up to 3 products at a time.');
                return;
            }
            this.items.push(product);
            this.isOpen = true;
            if (window.TechSound) window.TechSound.playPop();
        },
        removeItem(id) {
            this.items = this.items.filter(i => i.id !== id);
            if (this.items.length === 0) this.isOpen = false;
        },
        clearAll() {
            this.items = [];
            this.isOpen = false;
        }
     }"
     @add-to-compare.window="addCompare($event.detail)"
     x-show="isOpen && items.length > 0"
     x-cloak
     x-transition:enter="transition ease-out duration-400"
     x-transition:enter-start="opacity-0 translate-y-full"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-300"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-full"
     class="fixed bottom-0 left-0 right-0 z-40 bg-zinc-950/95 border-t border-white/10 shadow-[0_-20px_50px_rgba(0,0,0,0.8)] font-sans">
    
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-4">
            <div class="flex items-center gap-2">
                <span class="text-emerald-400 font-bold text-sm">⚖️ {% trans "Compare Devices" %}</span>
                <span class="text-xs text-gray-400 font-medium" x-text="'(' + items.length + '/3 selected)'"></span>
            </div>

            <div class="flex items-center gap-3">
                <button @click="clearAll()" class="text-xs text-gray-400 hover:text-white font-medium uppercase tracking-wider">{% trans "Clear All" %}</button>
                <button @click="isOpen = false" class="text-gray-400 hover:text-white p-1 rounded-full hover:bg-white/10 transition-colors focus:outline-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <template x-for="item in items" :key="item.id">
                <div class="relative p-3.5 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-between">
                    <div>
                        <div class="text-xs font-bold text-white truncate max-w-[180px]" x-text="item.name"></div>
                        <div class="text-xs font-extrabold text-emerald-400 mt-0.5" x-text="item.price"></div>
                    </div>

                    <button @click="removeItem(item.id)" class="text-gray-500 hover:text-red-400 p-1.5 rounded-full hover:bg-white/10 transition-colors" title="Remove">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
            </template>
        </div>
    </div>
</div>
