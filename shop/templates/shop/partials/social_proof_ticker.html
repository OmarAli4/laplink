{# ─────────────────────── LIVE SOCIAL PROOF TICKER ─────────────────────── #}
{% load i18n %}
<div x-data="{
        visible: false,
        activeProof: 0,
        intervalId: null,
        proofs: [
            { name: 'Omar A.', city: 'Cairo', item: 'MacBook Pro 16 M3', time: '2 mins ago', icon: '💻' },
            { name: 'Sarah M.', city: 'Alexandria', item: 'AirPods Pro 3', time: '5 mins ago', icon: '🎧' },
            { name: 'Khaled T.', city: 'Giza', item: 'Samsung Galaxy S25 Ultra', time: '8 mins ago', icon: '📱' },
            { name: 'Youssef H.', city: 'Mansoura', item: 'Apple Watch Ultra', time: '12 mins ago', icon: '⌚' },
            { name: 'Nour E.', city: 'Tanta', item: 'Anker 737 Power Bank', time: '18 mins ago', icon: '⚡' }
        ],
        init() {
            setTimeout(() => { this.showNext(); }, 3000);
            this.intervalId = setInterval(() => { this.showNext(); }, 12000);
        },
        showNext() {
            this.visible = true;
            setTimeout(() => { this.visible = false; }, 5000);
            setTimeout(() => {
                this.activeProof = (this.activeProof + 1) % this.proofs.length;
            }, 5500);
        }
     }"
     x-show="visible"
     x-cloak
     x-transition:enter="transition ease-out duration-500"
     x-transition:enter-start="opacity-0 translate-y-6 scale-90"
     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
     x-transition:leave="transition ease-in duration-300"
     x-transition:leave-start="opacity-100 translate-y-0 scale-100"
     x-transition:leave-end="opacity-0 translate-y-4 scale-95"
     class="hidden sm:block fixed bottom-6 left-6 z-40 max-w-xs w-full bg-zinc-950/90 border border-white/10 p-3.5 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.7)] font-sans">
    
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl shrink-0 border border-white/10 shadow-inner">
            <span x-text="proofs[activeProof].icon"></span>
        </div>
        
        <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-1">
                <span class="text-xs font-bold text-white truncate" x-text="proofs[activeProof].name"></span>
                <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    {% trans "Verified" %}
                </span>
            </div>
            <p class="text-[11px] text-gray-300 font-medium truncate mt-0.5">
                {% trans "Purchased" %} <span class="text-white font-semibold" x-text="proofs[activeProof].item"></span>
            </p>
            <p class="text-[10px] text-gray-500 font-medium" x-text="proofs[activeProof].city + ' • ' + proofs[activeProof].time"></p>
        </div>

        <button @click="visible = false; clearInterval(intervalId)" class="text-gray-500 hover:text-white p-1 rounded-full hover:bg-white/10 transition-colors focus:outline-none shrink-0" title="Dismiss">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
</div>
