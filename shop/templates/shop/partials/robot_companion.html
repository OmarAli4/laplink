{# ─────────────────────── UNIQUE PAGE-SPECIFIC ROBOT COMPANION ─────────────────────── #}
{% load i18n %}

{% with url=request.resolver_match.url_name %}

<div x-data="{
        page: '{% if url == 'home' %}home{% elif 'product_list' in url %}catalog{% elif url == 'product_detail' %}detail{% elif 'cart' in url %}cart{% elif 'wishlist' in url %}wishlist{% elif url == 'user_dashboard' %}dashboard{% else %}general{% endif %}',
        isHovering: false,
        hoveredTitle: '',
        showBubble: false,
        init() {
            setTimeout(() => { this.showBubble = true; }, 1500);
            setTimeout(() => { if(!this.isHovering) this.showBubble = false; }, 6000);
        }
     }"
     @robot-start.window="isHovering = true; hoveredTitle = $event.detail.title; if(window.TechSound) window.TechSound.playPop();"
     @robot-stop.window="isHovering = false; hoveredTitle = '';"
     class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-40 font-sans pointer-events-none transition-transform duration-300 transform-gpu scale-75 sm:scale-100 origin-bottom-right"
     :class="{ 'robot-home-smooth-patrol': page === 'home' && !isHovering }">

    <div class="relative flex flex-col items-end">

        <!-- Speech Bubble -->
        <div x-show="showBubble || isHovering"
             x-cloak
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-3 scale-90"
             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0 scale-100"
             x-transition:leave-end="opacity-0 translate-y-2 scale-90"
             class="mb-3 max-w-[220px] bg-zinc-950/95 border border-emerald-500/40 text-white text-xs font-bold p-3 rounded-2xl shadow-[0_10px_35px_rgba(16,185,129,0.3)] pointer-events-auto relative text-center">
            
            <!-- Page Specific Mascot Tag -->
            <template x-if="page === 'home'">
                <div>
                    <div class="text-emerald-400 text-[10px] uppercase font-extrabold tracking-wider mb-0.5">🎧 DJ ROBOT • HOST</div>
                    <div class="text-gray-200" x-text="hoveredTitle ? '🎉 ' + hoveredTitle : '{% trans "Welcome to Lap Link! Explore Next-Gen Tech!" %}'"></div>
                </div>
            </template>

            <template x-if="page === 'catalog'">
                <div>
                    <div class="text-cyan-400 text-[10px] uppercase font-extrabold tracking-wider mb-0.5">🔍 SCOUT ROBOT • RADAR</div>
                    <div class="text-gray-200" x-text="hoveredTitle ? '🔎 Inspecting: ' + hoveredTitle : '{% trans "Scanning products... Hover to inspect!" %}'"></div>
                </div>
            </template>

            <template x-if="page === 'detail'">
                <div>
                    <div class="text-amber-400 text-[10px] uppercase font-extrabold tracking-wider mb-0.5">🛠️ ENGINEER ROBOT • SPECS</div>
                    <div class="text-gray-200">{% trans "Hardware verified • 2-Year Warranty active! 🛡️" %}</div>
                </div>
            </template>

            <template x-if="page === 'cart'">
                <div>
                    <div class="text-emerald-400 text-[10px] uppercase font-extrabold tracking-wider mb-0.5">📦 COURIER ROBOT • CART</div>
                    <div class="text-gray-200">{% trans "Great choices in your cart! Ready for dispatch ⚡" %}</div>
                </div>
            </template>

            <template x-if="page === 'wishlist'">
                <div>
                    <div class="text-rose-400 text-[10px] uppercase font-extrabold tracking-wider mb-0.5">💖 GUARDIAN ROBOT • WISHLIST</div>
                    <div class="text-gray-200">{% trans "Safeguarding your top favorite devices! 💖" %}</div>
                </div>
            </template>

            <template x-if="page === 'dashboard'">
                <div>
                    <div class="text-indigo-400 text-[10px] uppercase font-extrabold tracking-wider mb-0.5">🛡️ SECURITY AGENT • ACCOUNT</div>
                    <div class="text-gray-200">{% trans "Account Secured! Welcome back, Commander 🫡" %}</div>
                </div>
            </template>

            <!-- Interactive Quick FAQ Chips inside Speech Bubble -->
            <div class="mt-2.5 pt-2 border-t border-white/10" x-data="{ customAnswer: '' }">
                <template x-if="customAnswer">
                    <div class="text-[11px] text-amber-300 font-extrabold animate-fade-in py-0.5" x-text="customAnswer"></div>
                </template>
                <template x-if="!customAnswer">
                    <div class="flex flex-wrap gap-1 justify-center">
                        <button type="button" @click="customAnswer = '{% trans '🚚 Free delivery on orders over L.E 5,000!' %}'; if(window.TechSound) window.TechSound.playPop();" class="px-2 py-0.5 rounded-full bg-white/10 hover:bg-emerald-500/20 text-[10px] text-gray-300 hover:text-emerald-300 transition-colors">
                            🚚 {% trans "Shipping?" %}
                        </button>
                        <button type="button" @click="customAnswer = '{% trans '🛡️ 2-Year Official Manufacturer Warranty!' %}'; if(window.TechSound) window.TechSound.playPop();" class="px-2 py-0.5 rounded-full bg-white/10 hover:bg-emerald-500/20 text-[10px] text-gray-300 hover:text-emerald-300 transition-colors">
                            🛡️ {% trans "Warranty?" %}
                        </button>
                    </div>
                </template>
            </div>

            <!-- Bubble Pointer -->
            <div class="absolute -bottom-2 right-6 w-3 h-3 bg-zinc-950 border-r border-b border-white/10 rotate-45"></div>
        </div>

        <!-- Robot Body Container -->
        <div class="pointer-events-auto cursor-pointer p-3 rounded-3xl bg-zinc-950/90 border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.7)] transition-all duration-300 hover:scale-110 transform-gpu"
             :class="{
                 'robot-dance-active border-emerald-500/60 shadow-[0_0_35px_rgba(16,185,129,0.5)]': page === 'home' || isHovering,
                 'robot-scout-active border-cyan-500/60 shadow-[0_0_35px_rgba(6,182,212,0.5)]': page === 'catalog' && !isHovering,
                 'robot-engineer-active border-amber-500/60 shadow-[0_0_35px_rgba(245,158,11,0.5)]': page === 'detail',
                 'robot-bounce-active border-emerald-500/60 shadow-[0_0_35px_rgba(16,185,129,0.5)]': page === 'cart',
                 'robot-heart-active border-rose-500/60 shadow-[0_0_35px_rgba(244,63,94,0.5)]': page === 'wishlist',
                 'robot-security-active border-indigo-500/60 shadow-[0_0_35px_rgba(99,102,241,0.5)]': page === 'dashboard'
             }"
             @click="showBubble = !showBubble; if(window.TechSound) window.TechSound.playPop();">
            
            <svg class="w-12 h-12 text-white" viewBox="0 0 100 100" fill="none">
                <!-- Antenna & Glow Light -->
                <line x1="50" y1="15" x2="50" y2="25" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                <circle cx="50" cy="12" r="5" 
                        :fill="page === 'home' ? '#10b981' : (page === 'catalog' ? '#06b6d4' : (page === 'detail' ? '#f59e0b' : (page === 'wishlist' ? '#f43f5e' : '#6366f1')))"
                        class="animate-ping"/>

                <!-- Head Accessories per Page -->
                <!-- Home: DJ Headset -->
                <template x-if="page === 'home'">
                    <g>
                        <path d="M 25 40 A 25 25 0 0 1 75 40" stroke="#10b981" stroke-width="4" fill="none"/>
                        <rect x="18" y="32" width="10" height="16" rx="4" fill="#10b981"/>
                        <rect x="72" y="32" width="10" height="16" rx="4" fill="#10b981"/>
                    </g>
                </template>

                <!-- Catalog: Radar Lens -->
                <template x-if="page === 'catalog'">
                    <circle cx="50" cy="12" r="8" stroke="#06b6d4" stroke-width="2" fill="none" class="animate-spin transform-gpu duration-1000"/>
                </template>

                <!-- Detail: Engineer Goggles -->
                <template x-if="page === 'detail'">
                    <path d="M 28 36 L 72 36" stroke="#f59e0b" stroke-width="4"/>
                </template>

                <!-- Wishlist: Floating Heart -->
                <template x-if="page === 'wishlist'">
                    <path d="M 50 8 L 53 12 L 47 12 Z" fill="#f43f5e"/>
                </template>

                <!-- Robot Head -->
                <rect x="26" y="24" width="48" height="34" rx="10" fill="#18181b" stroke="currentColor" stroke-width="3"/>
                
                <!-- Eyes Colors per Page -->
                <circle cx="40" cy="38" r="5" :fill="page === 'home' ? '#10b981' : (page === 'catalog' ? '#06b6d4' : (page === 'detail' ? '#f59e0b' : (page === 'wishlist' ? '#f43f5e' : '#6366f1')))" class="animate-pulse"/>
                <circle cx="60" cy="38" r="5" :fill="page === 'home' ? '#10b981' : (page === 'catalog' ? '#06b6d4' : (page === 'detail' ? '#f59e0b' : (page === 'wishlist' ? '#f43f5e' : '#6366f1')))" class="animate-pulse"/>
                
                <!-- Smile -->
                <path d="M 38 48 Q 50 56 62 48" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>

                <!-- Robot Body -->
                <rect x="30" y="62" width="40" height="30" rx="8" fill="#27272a" stroke="currentColor" stroke-width="3"/>
                <!-- Equalizer / Chest Display -->
                <rect x="38" y="70" width="24" height="14" rx="4" fill="#09090b"/>
                <rect x="42" y="74" width="3" height="6" :fill="page === 'catalog' ? '#06b6d4' : '#10b981'" />
                <rect x="48" y="72" width="3" height="10" :fill="page === 'detail' ? '#f59e0b' : '#3b82f6'" />
                <rect x="54" y="75" width="3" height="5" :fill="page === 'wishlist' ? '#f43f5e' : '#f59e0b'" />

                <!-- Left Arm -->
                <g :class="{ 'robot-arm-left-dance': isHovering || page === 'home' || page === 'cart' }">
                    <path d="M 30 68 C 18 68, 18 80, 22 86" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <circle cx="22" cy="86" r="4" fill="#a1a1aa"/>
                </g>

                <!-- Right Arm -->
                <g :class="{ 'robot-arm-right-dance': isHovering || page === 'home' || page === 'cart' }">
                    <path d="M 70 68 C 82 68, 82 80, 78 86" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <circle cx="78" cy="86" r="4" fill="#a1a1aa"/>
                </g>
            </svg>
        </div>
    </div>
</div>

<style>
/* 🚀 GPU-Accelerated Smooth Animations */
@keyframes smoothPatrolWalk {
    0% { transform: translate3d(0, 0, 0); }
    45% { transform: translate3d(-60vw, 0, 0) scaleX(1); }
    50% { transform: translate3d(-60vw, 0, 0) scaleX(-1); }
    95% { transform: translate3d(0, 0, 0) scaleX(-1); }
    100% { transform: translate3d(0, 0, 0) scaleX(1); }
}

.robot-home-smooth-patrol {
    animation: smoothPatrolWalk 16s ease-in-out infinite;
    will-change: transform;
}

@keyframes robotDanceAnim {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    25% { transform: translate3d(0, -6px, 0) rotate(-4deg); }
    75% { transform: translate3d(0, -6px, 0) rotate(4deg); }
}

@keyframes robotScoutAnim {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50% { transform: translate3d(0, -4px, 0) rotate(-6deg); }
}

@keyframes robotEngineerAnim {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(0, -6px, 0) scale(1.04); }
}

@keyframes robotBounceAnim {
    0%, 100% { transform: translate3d(0, 0, 0); }
    40% { transform: translate3d(0, -10px, 0); }
    60% { transform: translate3d(0, -3px, 0); }
}

@keyframes robotHeartAnim {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(0, -8px, 0) scale(1.05); }
}

@keyframes robotSecurityAnim {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(0, -2px, 0); }
}

@keyframes armLeftWiggle {
    0%, 100% { transform: rotate(0deg); transform-origin: 30px 68px; }
    50% { transform: rotate(-30deg); transform-origin: 30px 68px; }
}

@keyframes armRightWiggle {
    0%, 100% { transform: rotate(0deg); transform-origin: 70px 68px; }
    50% { transform: rotate(30deg); transform-origin: 70px 68px; }
}

.robot-dance-active { animation: robotDanceAnim 0.7s ease-in-out infinite; will-change: transform; }
.robot-scout-active { animation: robotScoutAnim 1.4s ease-in-out infinite; will-change: transform; }
.robot-engineer-active { animation: robotEngineerAnim 2s ease-in-out infinite; will-change: transform; }
.robot-bounce-active { animation: robotBounceAnim 1s ease-in-out infinite; will-change: transform; }
.robot-heart-active { animation: robotHeartAnim 1.6s ease-in-out infinite; will-change: transform; }
.robot-security-active { animation: robotSecurityAnim 2.2s ease-in-out infinite; will-change: transform; }

.robot-arm-left-dance { animation: armLeftWiggle 0.5s ease-in-out infinite alternate; }
.robot-arm-right-dance { animation: armRightWiggle 0.5s ease-in-out infinite alternate; }
</style>

{% endwith %}
