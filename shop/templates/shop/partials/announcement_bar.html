{# ─────────────────────── ANNOUNCEMENT BAR ─────────────────────── #}
{% load i18n %}
<div x-data="{ 
        show: true,
        activeSlide: 0,
        slides: [
            {% for ann in active_announcements %}
                '{{ ann.message|escapejs }}'{% if not forloop.last %},{% endif %}
            {% empty %}
                '{% trans "⚡ FREE Express Shipping on all orders over L.E 100!" %}',
                '{% trans "🛡️ 2-Year Official Warranty & 30-Day Money-Back Guarantee" %}',
                '{% trans "🏷️ Special Deal: Use code LAPLINK10 for 10% off your order!" %}'
            {% endfor %}
        ],
        timer: null
     }" 
     x-init="timer = setInterval(() => { activeSlide = (activeSlide + 1) % slides.length }, 4500)"
     x-show="show"
     x-transition:leave="transition ease-in duration-300"
     x-transition:leave-start="opacity-100 max-h-12"
     x-transition:leave-end="opacity-0 max-h-0 py-0"
     class="relative w-full z-50 bg-gradient-to-r from-zinc-950 via-zinc-900 to-zinc-950 border-b border-white/10 text-white text-xs font-semibold py-2.5 px-4 overflow-hidden font-sans">
    
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
        <!-- Left spacer for desktop symmetry -->
        <div class="hidden md:flex items-center gap-3 text-gray-400 text-[11px] font-medium tracking-wider uppercase">
            <span class="flex items-center gap-1.5 text-emerald-400 font-bold">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                {% trans "Live Store" %}
            </span>
            <span class="text-zinc-700">•</span>
            <span class="text-gray-300">{% trans "24/7 Tech Support" %}</span>
        </div>

        <!-- Center Auto-rotating Ticker -->
        <div class="flex-1 flex justify-center items-center text-center overflow-hidden min-h-[20px]">
            <template x-for="(slide, index) in slides" :key="index">
                <div x-show="activeSlide === index"
                     x-transition:enter="transition ease-out duration-500"
                     x-transition:enter-start="opacity-0 translate-y-2 scale-95"
                     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                     x-transition:leave="transition ease-in duration-300 absolute"
                     x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                     x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
                     class="tracking-wide font-medium text-gray-200">
                    <span x-text="slide"></span>
                </div>
            </template>
        </div>

        <!-- Right Quick Promo / Close Button -->
        <div class="flex items-center gap-3">
            <a href="{% url 'shop:product_list' %}" class="hidden sm:inline-flex items-center gap-1 text-[11px] font-bold text-white bg-white/10 hover:bg-white/20 border border-white/10 px-3 py-1 rounded-full uppercase tracking-wider transition-colors transition-transform hover:scale-105">
                <span>{% trans "Shop Deals" %}</span>
                <span>&rarr;</span>
            </a>
            <button @click="show = false; clearInterval(timer)" class="text-gray-400 hover:text-white p-1 rounded-full hover:bg-white/10 transition-colors focus:outline-none" title="Dismiss">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
</div>
