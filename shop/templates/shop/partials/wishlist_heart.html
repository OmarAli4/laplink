<button hx-post="{% url 'shop:wishlist_toggle' product.id %}"
        hx-target="#wishlist-heart-{{ product.id }}"
        hx-swap="outerHTML"
        id="wishlist-heart-{{ product.id }}"
        class="group flex items-center justify-center p-3 rounded-full border {% if in_wishlist %}border-rose-500 bg-rose-50{% else %}border-black/[0.08] bg-white hover:border-black/25{% endif %} transition-all duration-200 shadow-sm"
        title="{% if in_wishlist %}Remove from Wishlist{% else %}Add to Wishlist{% endif %}">
    <svg class="w-6 h-6 {% if in_wishlist %}text-rose-600 fill-current{% else %}text-[#6E6E73] group-hover:text-rose-600{% endif %} transition-colors"
         {% if not in_wishlist %}fill="none" stroke="currentColor" stroke-width="2"{% endif %}
         viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
    </svg>
</button>
