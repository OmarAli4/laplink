<span id="cart-counter"
      class="px-1.5 py-0.5 min-w-[18px] text-center text-[10px] font-extrabold rounded-full bg-emerald-400 text-zinc-950 transition-colors shadow {% if not cart|length %}hidden{% endif %}"
      style="animation: badgePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);">
    {{ cart|length }}
</span>

<style>
@keyframes badgePop {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); }
}
</style>
