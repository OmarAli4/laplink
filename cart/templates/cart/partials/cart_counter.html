<span id="cart-counter"
      class="absolute -top-0.5 -right-0.5 min-w-[20px] h-5 flex items-center
             justify-center px-1 text-xs font-bold rounded-full
             bg-black text-white
             shadow-md shadow-gray-400/30
             {% if not cart|length %}hidden{% endif %}"
      style="animation: badgePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);">
    {{ cart|length }}
</span>

<style>
@keyframes badgePop {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); }
}
</style>
