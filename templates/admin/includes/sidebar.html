{% load static %}
<!-- Buttery Silky Smooth Collapsible Navigation Sidebar with Animated Laser-Flow Brand Logo -->
<aside :class="isSidebarOpen ? 'w-64' : 'w-20'" class="shrink-0 bg-black border-r border-zinc-800 p-4 flex flex-col justify-between sticky top-0 h-screen overflow-y-auto text-zinc-300 font-sans z-30 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]">
    
    <!-- Top Navigation Links -->
    <div class="space-y-6 w-full">
        
        <!-- Brand Header with Animated Actual Lap Link Logo -->
        <div class="flex items-center gap-3 border-b border-zinc-800 pb-4 px-1" :class="isSidebarOpen ? 'justify-start' : 'justify-center'">
            <div class="relative w-11 h-11 rounded-2xl bg-zinc-950 flex items-center justify-center border border-emerald-500/60 shadow-[0_0_20px_rgba(16,185,129,0.4)] shrink-0 group cursor-pointer overflow-hidden transition-all hover:scale-105">
                <!-- Energy Pulse Glow behind logo -->
                <div class="absolute inset-0 bg-emerald-500/20 rounded-2xl animate-ping opacity-25"></div>
                <div class="absolute -inset-2 border border-cyan-500/30 rounded-2xl border-dashed animate-spin duration-[8000ms] pointer-events-none"></div>

                <!-- Actual Lap Link SVG Brand Logo with Laser Glow Animations -->
                <svg class="w-6 h-6 text-emerald-400 group-hover:scale-110 transition-transform duration-500 z-10 drop-shadow-[0_0_10px_rgba(16,185,129,0.8)]" viewBox="14 14 112 82" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="miter" stroke-linecap="butt">
                    <path d="M 50 50 L 20 50 L 20 90 L 80 90 L 80 50 L 70 50" class="animate-[logoLaserFlow_2s_ease-in-out_infinite]" />
                    <path d="M 70 60 L 60 60 L 60 20 L 120 20 L 120 60 L 90 60" class="animate-[logoLaserFlow_2s_ease-in-out_infinite_1s]" />
                </svg>
            </div>
            <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px]' : 'opacity-0 max-w-0 pointer-events-none'" class="transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                <div class="text-base font-black text-white font-display tracking-tight uppercase">Lap Link</div>
                <div class="text-[10px] font-mono text-emerald-400 font-bold tracking-widest flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    CYBERNETICS
                </div>
            </div>
        </div>

        <!-- Primary Navigation -->
        <nav class="space-y-1.5 font-medium text-sm w-full">
            
            <!-- Dashboard -->
            <!-- Dashboard -->
            <a href="/manage-store/" class="flex items-center rounded-2xl transition-all duration-300 group py-2.5 px-3 {% if request.path == '/manage-store/' %}bg-white text-black font-bold shadow-lg{% else %}text-zinc-300 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800{% endif %}" title="Dashboard">
                <svg class="w-5 h-5 shrink-0 {% if request.path == '/manage-store/' %}text-black{% else %}text-zinc-400 group-hover:text-emerald-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>Dashboard</span>
                </div>
            </a>

            <!-- Products -->
            <!-- Products -->
            <a href="/manage-store/shop/product/" class="flex items-center rounded-2xl transition-all duration-300 group py-2.5 px-3 {% if '/manage-store/shop/product/' in request.path %}bg-white text-black font-bold shadow-lg{% else %}text-zinc-300 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800{% endif %}" title="Products">
                <svg class="w-5 h-5 shrink-0 {% if '/manage-store/shop/product/' in request.path %}text-black{% else %}text-zinc-400 group-hover:text-emerald-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>Products</span>
                    <span class="text-xs font-mono font-bold text-zinc-400 bg-zinc-900 px-2 py-0.5 rounded-full border border-zinc-800 shrink-0">Catalog</span>
                </div>
            </a>

            <!-- Orders -->
            <!-- Orders -->
            <a href="/manage-store/orders/order/" class="flex items-center rounded-2xl transition-all duration-300 group py-2.5 px-3 {% if '/manage-store/orders/order/' in request.path %}bg-white text-black font-bold shadow-lg{% else %}text-zinc-300 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800{% endif %}" title="Orders">
                <svg class="w-5 h-5 shrink-0 {% if '/manage-store/orders/order/' in request.path %}text-black{% else %}text-zinc-400 group-hover:text-cyan-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>Orders</span>
                    <span class="text-xs font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/30 shrink-0">Live</span>
                </div>
            </a>

            <!-- Categories -->
            <!-- Categories -->
            <a href="/manage-store/shop/category/" class="flex items-center rounded-2xl transition-all duration-300 group py-2.5 px-3 {% if '/manage-store/shop/category/' in request.path %}bg-white text-black font-bold shadow-lg{% else %}text-zinc-300 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800{% endif %}" title="Categories">
                <svg class="w-5 h-5 shrink-0 {% if '/manage-store/shop/category/' in request.path %}text-black{% else %}text-zinc-400 group-hover:text-amber-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>Categories</span>
                </div>
            </a>

            <!-- Coupons -->
            <!-- Coupons -->
            <a href="/manage-store/coupons/coupon/" class="flex items-center rounded-2xl transition-all duration-300 group py-2.5 px-3 {% if '/manage-store/coupons/coupon/' in request.path %}bg-white text-black font-bold shadow-lg{% else %}text-zinc-300 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800{% endif %}" title="Coupons">
                <svg class="w-5 h-5 shrink-0 {% if '/manage-store/coupons/coupon/' in request.path %}text-black{% else %}text-zinc-400 group-hover:text-purple-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>Coupons</span>
                    <span class="text-[11px] font-bold text-black bg-zinc-200 px-2 py-0.5 rounded-full uppercase tracking-wider shrink-0">New</span>
                </div>
            </a>

            <!-- Brands -->
            <!-- Brands -->
            <a href="/manage-store/shop/brand/" class="flex items-center rounded-2xl transition-all duration-300 group py-2.5 px-3 {% if '/manage-store/shop/brand/' in request.path %}bg-white text-black font-bold shadow-lg{% else %}text-zinc-300 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800{% endif %}" title="Brands">
                <svg class="w-5 h-5 shrink-0 {% if '/manage-store/shop/brand/' in request.path %}text-black{% else %}text-zinc-400 group-hover:text-yellow-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>Brands</span>
                </div>
            </a>
        </nav>

        <!-- Divider -->
        <div class="border-t border-zinc-800 my-4 w-full"></div>

        <!-- Secondary Section -->
        <div class="space-y-1.5 font-medium text-sm w-full">
            <a href="/manage-store/auth/user/" class="flex items-center rounded-2xl transition-all duration-300 group py-2.5 px-3 {% if '/manage-store/auth/user/' in request.path %}bg-white text-black font-bold shadow-lg{% else %}text-zinc-300 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800{% endif %}" title="People & Users">
                <svg class="w-5 h-5 shrink-0 {% if '/manage-store/auth/user/' in request.path %}text-black{% else %}text-zinc-400 group-hover:text-indigo-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>People & Users</span>
                </div>
            </a>

            <a href="/manage-store/emails/emaillog/" class="flex items-center rounded-2xl transition-all duration-300 group py-2.5 px-3 {% if '/manage-store/emails/emaillog/' in request.path %}bg-white text-black font-bold shadow-lg{% else %}text-zinc-300 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800{% endif %}" title="Email Logs">
                <svg class="w-5 h-5 shrink-0 {% if '/manage-store/emails/emaillog/' in request.path %}text-black{% else %}text-zinc-400 group-hover:text-blue-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>Email Logs</span>
                </div>
            </a>
        </div>
    </div>

    <!-- Bottom Footer Links & User Profile -->
    <div class="space-y-4 pt-6 border-t border-zinc-800 w-full">
        
        <!-- Notifications & Storefront -->
        <div class="space-y-1 font-medium text-sm w-full">
            <a href="/" target="_blank" class="flex items-center rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-900 transition-all py-2 px-3" title="View Storefront">
                <svg class="w-4 h-4 text-zinc-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>View Storefront</span>
                </div>
            </a>

            <div class="flex items-center rounded-xl text-zinc-400 hover:text-white transition-all cursor-pointer py-2 px-3" title="Notifications">
                <svg class="w-4 h-4 text-zinc-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                    <span>Notifications</span>
                    <span class="w-5 h-5 rounded-full bg-rose-500 text-white font-bold text-[11px] flex items-center justify-center shadow-lg shrink-0">3</span>
                </div>
            </div>
        </div>

        <!-- User Profile Card -->
        <div class="flex items-center p-2.5 rounded-2xl bg-zinc-950 border border-zinc-800" title="Executive Admin">
            <div class="w-9 h-9 rounded-full overflow-hidden border border-emerald-500/40 shrink-0">
                <img src="{% static 'shop/images/cyber_bot_avatar.jpg' %}" alt="Executive Profile" class="w-full h-full object-cover">
            </div>
            <div :class="isSidebarOpen ? 'opacity-100 max-w-[160px] ml-3' : 'opacity-0 max-w-0 ml-0 pointer-events-none'" class="flex-1 flex items-center justify-between transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] whitespace-nowrap overflow-hidden">
                <div class="min-w-0 flex-1">
                    <div class="text-xs font-bold text-white truncate font-display">Executive Admin</div>
                    <div class="text-[10px] text-emerald-400 font-mono font-semibold">Store Director</div>
                </div>
                <form action="{% url 'admin:logout' %}" method="post" class="shrink-0 ml-2">
                    {% csrf_token %}
                    <button type="submit" title="Log out" class="text-zinc-500 hover:text-rose-400 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    </button>
                </form>
            </div>
        </div>

    </div>

</aside>

<!-- Keyframe Animation for Brand Logo Energy Flow -->
<style>
@keyframes logoLaserFlow {
    0%, 100% { stroke: #10b981; filter: drop-shadow(0 0 6px #10b981); }
    50% { stroke: #06b6d4; filter: drop-shadow(0 0 12px #06b6d4); }
}
</style>
