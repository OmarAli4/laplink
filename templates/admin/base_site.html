{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | {{ site_title|default:_('Django site admin') }}{% endblock %}

{% block branding %}
<div id="site-name" class="flex items-center gap-3">
    <a href="{% url 'admin:index' %}" class="flex items-center gap-3 group">
        <div class="w-8 h-8 rounded-xl bg-emerald-500/20 flex items-center justify-center border border-emerald-500/30 group-hover:bg-emerald-500/30 transition-colors shadow-sm">
            <svg class="w-4 h-4 text-emerald-400" viewBox="14 14 112 82" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="miter" stroke-linecap="butt">
                <path d="M 50 50 L 20 50 L 20 90 L 80 90 L 80 50 L 70 50" />
                <path d="M 70 60 L 60 60 L 60 20 L 120 20 L 120 60 L 90 60" />
            </svg>
        </div>
        <span class="font-display text-white text-lg font-extrabold tracking-tight uppercase group-hover:text-emerald-400 transition-colors">Lap Link</span>
    </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
